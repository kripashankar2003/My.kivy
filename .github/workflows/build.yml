name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk libffi-dev libssl-dev build-essential ccache git libltdl-dev

    - name: Install Correct Packaging Tools
      run: |
        python -m pip install --upgrade pip
        pip install "cython<3.0.0" "setuptools<69.0.0" "buildozer==1.5.0"

    - name: Build APK with Buildozer
      env:
        ACCEPT_SDK_LICENSE: 'yes'
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
